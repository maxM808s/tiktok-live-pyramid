name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/engine.test.mjs tests/gift-library.test.mjs tests/connection.test.mjs
      - run: node --check server/server.mjs
      - run: node --check dashboard/app.js
      - name: Parse Windows scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem scripts/*.ps1,tests/*.ps1) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; throw "PowerShell parse failed: $file" }
          }
  windows-startup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test no-install Windows startup using only built-ins and the existing browser
        shell: powershell
        env:
          PYRAMID_HEADLESS_TEST: '1'
        run: |
          # Remove installed development runtimes from PATH to prove they are not used.
          $env:PATH=($env:PATH.Split(';') | Where-Object { $_ -and !(Test-Path (Join-Path $_ 'node.exe')) -and !(Test-Path (Join-Path $_ 'godot.exe')) }) -join ';'
          if (Get-Command node -ErrorAction SilentlyContinue) { throw 'Node is still on PATH; no-install test would be invalid' }
          Remove-Item Env:GODOT_EXE -ErrorAction SilentlyContinue
          $smokePath=Join-Path $env:RUNNER_TEMP 'Pyramid Live Smoke'
          Copy-Item -LiteralPath $env:GITHUB_WORKSPACE -Destination $smokePath -Recurse
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $smokePath 'tests/windows-smoke.ps1')
          if ($LASTEXITCODE) { throw 'No-install Windows startup failed' }
